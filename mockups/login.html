<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>速読マスター - ログイン</title>
    
    <!-- Material UI CDN -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-icon {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .app-title {
            font-size: 28px;
            color: #333;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .app-subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .input-field {
            margin-bottom: 20px;
        }
        
        .input-field input {
            font-size: 16px;
            padding: 10px 0;
        }
        
        .input-field label {
            font-size: 14px;
        }
        
        .input-field .material-icons {
            color: #667eea;
        }
        
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .register-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        
        .character-decoration {
            position: fixed;
            font-size: 30px;
            opacity: 0.1;
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .char-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .char-2 { top: 10%; right: 10%; animation-delay: 1s; }
        .char-3 { bottom: 10%; left: 10%; animation-delay: 2s; }
        .char-4 { bottom: 10%; right: 10%; animation-delay: 3s; }
    </style>
</head>
<body>
    <!-- 背景装飾 -->
    <div class="character-decoration char-1">📚</div>
    <div class="character-decoration char-2">🏃</div>
    <div class="character-decoration char-3">✨</div>
    <div class="character-decoration char-4">🎯</div>
    
    <div class="login-container">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="material-icons" style="font-size: 60px;">speed</i>
            </div>
            <h1 class="app-title">速読マスター</h1>
            <p class="app-subtitle">楽しく速読力を身につけよう！</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            ユーザーIDまたはパスワードが正しくありません
        </div>
        
        <form id="loginForm">
            <div class="input-field">
                <i class="material-icons prefix">person</i>
                <input type="text" id="userId" required>
                <label for="userId">ユーザーID</label>
            </div>
            
            <div class="input-field">
                <i class="material-icons prefix">lock</i>
                <input type="password" id="password" required>
                <label for="password">パスワード</label>
            </div>
            
            <button type="submit" class="login-btn waves-effect waves-light">
                ログイン
            </button>
        </form>
        
        <div class="register-link">
            <p>はじめての方は</p>
            <a href="/register">新規登録はこちら</a>
        </div>
    </div>
    
    <!-- Materialize JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    
    <script>
        // Materialize初期化
        document.addEventListener('DOMContentLoaded', function() {
            M.updateTextFields();
        });
        
        // ログインフォーム処理
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            
            // デモ用の簡単な検証
            if (userId === 'demo' && password === '1234') {
                // 成功時のアニメーション
                this.style.opacity = '0.5';
                setTimeout(() => {
                    alert('ログイン成功！ホーム画面へ移動します');
                    // 実際にはここでリダイレクト処理
                    window.location.href = '/home';
                }, 500);
            } else if (userId && password) {
                // エラー表示
                const errorMsg = document.getElementById('errorMessage');
                errorMsg.style.display = 'block';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
